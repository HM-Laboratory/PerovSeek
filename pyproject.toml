[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perovseek"
version = "0.4.0"
description = "Nine-component formulation optimization and spectral PCE prediction"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.0",
    "numpy==2.5.3",
    "pandas>=2.2,<3.1",
    "openpyxl>=3.1,<4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "botorch==0.18.1",
    "gpytorch==1.15.2",
]

[project.optional-dependencies]
demo = ["notebook>=7,<8", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
include = ["perovseek*"]
